# version: "3.9"

services:
  linklian-core:
    build: .
    expose:
      - "5400"
    # volumes:
    #   - .:/app
      # - /app/node_modules
    environment:
      - PORT=${PORT}
      - PG_HOST=${PG_HOST}
      - PG_DATABASE=${PG_DATABASE}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - SALTNUMBER=${SALTNUMBER}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_EXPIRES_IN=${TOKEN_EXPIRES_IN}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - API_PREFIX=${API_PREFIX}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: npm run start:prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # deploy:
    #   mode: replicated
    #   replicas: 3      # รัน 3 Instances พร้อมกัน
    #   restart_policy:
    #     condition: on-failure
    mem_limit: 500m
    restart: on-failure
    networks:
      - linklian-net
    
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    mem_limit: 200m
    volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx:ro
    depends_on:
      - linklian-core
    networks:
      - linklian-net

networks:
  linklian-net:
    external: true