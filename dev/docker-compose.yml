name: LinkLian-Redis

services:
  linklian-redis:
    image: redis:7-alpine
    container_name: linklian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  linklian-upstash-redis:
    image: hiett/serverless-redis-http:latest
    container_name: linklian-upstash-redis
    ports:
      - "4001:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: 12345678
      SRH_CONNECTION_STRING: redis://linklian-redis:6379
    depends_on:
      linklian-redis:
        condition: service_healthy

volumes:
  redis-data:
    driver: local